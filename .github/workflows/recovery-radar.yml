name: Recovery Radar

on:
  push:
    branches: ['recovery-radar/program-cancellation-claims']
  pull_request:

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest
