name: DebtRecover Neon Main Authenticated RLS Canary

on:
  push:
    branches: [debtrecover-v0.4.1]
    paths:
      - '.github/workflows/debtrecover-neon-main-auth-rls-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-authenticated-jwt-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke DebtRecover main authenticated canary
        run: |
          set -euo pipefail
          set +e
          http_code=$(curl --silent --show-error --retry 2 --max-time 30 \
            -o probe.json -w '%{http_code}' \
            'https://br-polished-block-b1c1p62e-drmainprobe.compute.c-5.eu-central-1.aws.neon.tech/')
          set -e
          cat probe.json
          echo "HTTP_CODE=${http_code}"
          test "${http_code}" = "200" -o "${http_code}" = "409"
      - name: Validate provider-mediated identity invariants
        run: |
          python - <<'PY'
          import json
          p=json.load(open('probe.json'))
          assert p.get('marker') == 'DEBTRECOVER_AUTH_RLS_V045', p
          assert p.get('synthetic') is True, p
          assert p.get('signed_session_cookie_present') is True, p
          assert p.get('token_present') is True, p
          assert p.get('signature_verified') is True, p
          assert p.get('alg') == 'EdDSA', p
          assert isinstance(p.get('authenticated_sub'), str) and p['authenticated_sub'], p
          assert p.get('role') == 'authenticated', p
          assert p.get('tenant_claim_present') is False, p
          assert p.get('roles_claim_present') is False, p
          assert p.get('data_api_get_status') == 200, p
          assert p.get('cross_tenant_insert_rejected') is True, p
          assert p.get('provider_signout_status') == 200, p
          print('DEBTRECOVER_MAIN_IDENTITY_BOUNDARY=PASS')
          print('CANARY_SUB=' + p['authenticated_sub'])
          print('MAIN_RLS_FULL_PASS=' + str(bool(p.get('pass'))).lower())
          PY
