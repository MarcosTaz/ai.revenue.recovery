name: AERVIND V39 Protected Preview Validation
on:
  push:
    branches:
      - audit/aervind-release-gates-20261027
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b163f8e6b9f36f6e8e6ed70d18
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install preview test dependency
        run: python -m pip install -r requirements.txt
      - name: Test recovery engine, safety gates and Flask routes
        env:
          AERVIND_NO_SEND_HOLD: ACTIVE
          AERVIND_ENV: preview
        run: python -m unittest discover -s tests -v
