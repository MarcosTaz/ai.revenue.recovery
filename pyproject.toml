[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recovery-radar"
version = "0.2.1"
description = "Evidence-first supplier recovery claim engine"
requires-python = ">=3.11"

[project.scripts]
recovery-radar = "recovery_radar.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
